kind: Deployment
apiVersion: apps/v1
metadata:
  name: wezvatech-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      env: mentos-deployment
  template:
    metadata:
      name: techie-pods
      labels:
        env: mentos-deployment
    spec:
      containers:
        - name: init-container
          image: alpine:latest
          ports:
            - containerPort: 80
          
          command: ["/bin/sh", "-c", "echo This is the init container; sleep 5"]
          resources:
            requests:
              memory: "400Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "200m"
          env:
            - name: ENV
              value: STAGE
            - name: SESSION
              value: PODS
          livenessProbe:
            exec:
              command:
                - ls
                - echo "Hello your livenessProbe is working fine and the app container is live"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - ls
                - echo "Hello your readinessProbe is working perfectly and your app container is ready"
            initialDelaySeconds: 12
            periodSeconds: 4
            timeoutSeconds: 10
          volumeMounts: 
            - name: emptydir
              mountPath: /dev/empvol

            - name: wezvatech-persistent-volume
              mountPath: /dev/vol 
        
        - name: application-container
          image: ubuntu/nginx:latest
          ports:
            - containerPort: 80
          command: ["/bin/bash", "-c", "echo 'This is the main application container' > index.html; sleep 5"]
          resources:
            requests:
              memory: "400Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "200m"
          env:
            - name: ENV
              value: STAGE
            - name: SESSION
              value: PODS
          livenessProbe:
            exec:
              command:
                - ls
                - echo "Hello your livenessProbe is working fine and the app is live"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - ls
                - echo "Hello your readinessProbe is working perfectly and your application is ready"
            initialDelaySeconds: 12
            periodSeconds: 4
            timeoutSeconds: 10
          volumeMounts: 
            - name: emptydir
              mountPath: /dev/empvol
            
            - name: wezvatech-persistent-volume
              mountPath: /dev/vol 

        - name: sidecar-container
          image: alpine:latest
          ports:
            - containerPort: 80
         
          command: ["/bin/sh", "-c", "echo 'This is the sidecar-container' > index.html; sleep 5"]
          resources:
            requests:
              memory: "400Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "200m"
          env:
            - name: ENV
              value: STAGE
            - name: SESSION
              value: PODS
          livenessProbe:
            exec:
              command:
                - ls
                - echo "Hello your livenessProbe is working fine and the sidecar is live"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - ls
                - echo "Hello your readinessProbe is working perfectly and your sidecar container is ready"
            initialDelaySeconds: 12
            periodSeconds: 4
            timeoutSeconds: 10
          volumeMounts:
            - name: emptydir
              mountPath: /dev/empvol

            - name: wezvatech-persistent-volume
              mountPath: /dev/vol     

      volumes:
        - name: emptydir
          emptyDir: {}

        - name: wezvatech-persistent-volume
          persistentVolumeClaim:
            claimName: wezvatech-pvc